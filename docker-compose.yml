services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-factory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: af
      POSTGRES_PASSWORD: af_password
      POSTGRES_DB: agent_factory
    ports:
      - "5433:5432"
    volumes:
      - af_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U af -d agent_factory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  af_pgdata:
